<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where2Go · 目的地地图(阶段1a)</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;margin:0;background:#f5f7fa;color:#1f2937}
  header{background:#0f766e;color:#fff;padding:14px 22px}
  header h1{margin:0;font-size:19px}
  header p{margin:5px 0 0;font-size:13px;opacity:.92}
  header a{color:#ccfbf1}
  main{max-width:1180px;margin:16px auto;padding:0 16px}
  .card{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:12px}
  label{font-weight:600;font-size:13px;display:block;margin-bottom:5px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .field{flex:1;min-width:150px}
  .inline{display:flex;gap:8px}
  input,select{width:100%;padding:9px 10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;box-sizing:border-box}
  button{background:#0f766e;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:14px;cursor:pointer;white-space:nowrap}
  button.secondary{background:#e5e7eb;color:#1f2937}
  button:disabled{opacity:.5;cursor:wait}
  #map{height:62vh;min-height:420px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);background:#e8eef1}
  .status{color:#6b7280;font-size:13px;margin-top:10px}
  .status b{color:#0f766e}
  .err{color:#b91c1c;background:#fee2e2;padding:10px 14px;border-radius:8px;margin-top:10px;font-size:14px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:#374151}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
  .legend b{color:#6b7280}
  .pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2px solid #fff;
       box-shadow:0 1px 4px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  .pin span{transform:rotate(45deg);font-size:12px;line-height:1}
  .leaflet-popup-content{margin:12px 14px}
  .pop .nm{font-weight:700;font-size:15px;margin-bottom:5px}
  .pop .cat{display:inline-block;color:#fff;font-size:12px;padding:1px 8px;border-radius:10px}
  .pop .kv{color:#374151;font-size:13px;margin-top:6px}
  .pop .kv b{color:#0f766e}
  .pop .intro{color:#6b7280;font-size:13px;margin-top:7px;border-top:1px dashed #e5e7eb;padding-top:6px}
  footer{color:#9ca3af;font-size:12px;text-align:center;padding:14px}
</style>
</head>
<body>
<header>
  <h1>🧭 Where2Go · 目的地地图 <span style="font-weight:400;font-size:13px">(阶段1a 骨架)</span></h1>
  <p>起点城市 + 环形距离分段 → 地图渲染已入库目的地 ·
     <a href="/list.html">列表模式(POC)</a> · <a href="/docs">API 文档</a></p>
</header>
<main>
  <div class="card">
    <div class="row">
      <div class="field"><label for="city">起点城市</label>
        <div class="inline">
          <input id="city" value="上海" placeholder="如:北京、上海、苏州" autocomplete="off">
          <button id="goCity">搜索</button>
        </div>
      </div>
      <div class="field"><label for="band">距离分段(环形,互斥)</label><select id="band"></select></div>
      <div class="field"><label for="category">分类</label><select id="category"></select></div>
      <div class="field" style="flex:0 0 auto"><label>&nbsp;</label>
        <button id="reload" class="secondary" title="忽略库缓存,重新抓一次 Overpass">重新抓取</button></div>
    </div>
    <div class="status" id="status">初始化…</div>
    <div class="legend" id="legend"></div>
    <div class="err" id="err" style="display:none"></div>
  </div>
  <div id="map"></div>
</main>
<footer>
  Where2Go 阶段1a · 地图:Leaflet + OpenStreetMap 瓦片 · 数据:Overpass 抓取后入 SQLite,
  同一「城市 + 分段」二次查询只读库不触网 · 分类为简化归类,四分类优先级去重与简介见 TASK-1b
</footer>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const $=id=>document.getElementById(id);
const DEFAULT_CITY="上海";
const FALLBACK_CENTER=[31.2304,121.4737];
const RING_COLOR="#0f766e";
const state={meta:{bands:[],categories:[]},origin:null,band:"50_100",category:"",bandMeta:null,cached:{}};
let map=null,rings=null,pins=null,outerRing=null;

function esc(value){
  return String(value===null||value===undefined?"":value)
    .replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}
function setStatus(html){$("status").innerHTML=html;}
function showErr(message){$("err").textContent=message||"";$("err").style.display=message?"block":"none";}
function setBusy(busy){["goCity","reload","band","category"].forEach(id=>{$(id).disabled=busy;});}

async function getJSON(url){
  const response=await fetch(url);
  const data=await response.json().catch(()=>({}));
  if(!response.ok) throw new Error(data.detail||("HTTP "+response.status));
  return data;
}

function categoryMeta(key){
  return state.meta.categories.find(item=>item.key===key)
    ||{key:key||"其他",label:key||"其他",color:"#6b7280",emoji:"📍"};
}
function currentBand(){
  return state.meta.bands.find(band=>band.key===state.band)
    ||state.meta.bands[0]||{key:state.band,label:state.band,low:50,high:100};
}

function initMap(){
  map=L.map("map").setView(FALLBACK_CENTER,8);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
    maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);
  rings=L.layerGroup().addTo(map);
  pins=L.layerGroup().addTo(map);
}

function renderBandOptions(){
  $("band").innerHTML=state.meta.bands.map(band=>{
    const count=state.cached[band.key];
    const suffix=(count===undefined)?"(未入库,首次需抓取)":("(已入库 "+count+" 条)");
    const selected=band.key===state.band?" selected":"";
    return '<option value="'+esc(band.key)+'"'+selected+'>'+esc(band.label)+" "+esc(suffix)+"</option>";
  }).join("");
}

function renderCategoryOptions(){
  const all='<option value=""'+(state.category?"":" selected")+'>全部分类</option>';
  $("category").innerHTML=all+state.meta.categories.map(item=>{
    const selected=item.key===state.category?" selected":"";
    return '<option value="'+esc(item.key)+'"'+selected+">"+esc(item.label)+"</option>";
  }).join("");
}

function renderLegend(counts){
  $("legend").innerHTML=state.meta.categories.map(item=>{
    const total=(counts||{})[item.key]||0;
    return '<span><i style="background:'+item.color+'"></i>'+esc(item.label)+" <b>"+total+"</b></span>";
  }).join("");
}

// 当前 band 的环形范围圈:外圆(上限半径)+ 内圆虚线(下限半径)= 环带示意
function drawRings(){
  if(!map||!state.origin) return;
  rings.clearLayers();
  outerRing=null;
  const band=currentBand();
  const at=[state.origin.lat,state.origin.lng];
  outerRing=L.circle(at,{radius:band.high*1000,color:RING_COLOR,weight:2,fillColor:RING_COLOR,fillOpacity:.06});
  const innerRing=L.circle(at,{radius:band.low*1000,color:RING_COLOR,weight:1.5,dashArray:"6 6",fill:false});
  outerRing.bindTooltip(band.label+" 外圈("+band.high+" km)");
  innerRing.bindTooltip(band.label+" 内圈("+band.low+" km)");
  const center=L.circleMarker(at,{radius:6,color:"#fff",weight:2,fillColor:RING_COLOR,fillOpacity:1});
  center.bindTooltip(state.origin.name+"(起点)",{direction:"top"});
  rings.addLayer(outerRing);rings.addLayer(innerRing);rings.addLayer(center);
}

function fitRings(){if(map&&outerRing) map.fitBounds(outerRing.getBounds(),{padding:[24,24]});}

function popupHtml(place){
  const meta=categoryMeta(place.category);
  const bandLabel=(state.bandMeta&&state.bandMeta.label)||currentBand().label;
  const distance=(place.distance_km===null||place.distance_km===undefined)?"—":(place.distance_km+" km");
  const intro=place.intro?esc(place.intro):"简介待生成(TASK-1b:LLM 一句话简介)";
  return '<div class="pop"><div class="nm">'+(esc(place.name)||"(无名)")+"</div>"+
    '<span class="cat" style="background:'+meta.color+'">'+meta.emoji+" "+esc(meta.label)+"</span>"+
    '<div class="kv">距起点直线 <b>'+distance+"</b> · 分段 "+esc(bandLabel)+"</div>"+
    '<div class="kv">OSM:'+esc(place.osm_type)+"/"+esc(place.osm_id)+
      " · "+Number(place.lat).toFixed(4)+", "+Number(place.lng).toFixed(4)+"</div>"+
    '<div class="intro">'+intro+"</div></div>";
}

function drawPins(places){
  pins.clearLayers();
  (places||[]).forEach(place=>{
    const meta=categoryMeta(place.category);
    const icon=L.divIcon({className:"",iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24],
      html:'<div class="pin" style="background:'+meta.color+'"><span>'+meta.emoji+"</span></div>"});
    const marker=L.marker([place.lat,place.lng],{icon:icon,title:place.name||""});
    marker.bindPopup(popupHtml(place));
    pins.addLayer(marker);
  });
}

async function loadMeta(){
  state.meta=await getJSON("/api/places/meta");
  if(!state.meta.bands.some(band=>band.key===state.band)) state.band=state.meta.bands[0].key;
  renderBandOptions();renderCategoryOptions();renderLegend({});
}

// 起点城市搜索:复用后端 /api/geocode(Nominatim),顺便拿到"哪些分段已入库"
async function searchCity(city){
  const name=(city||"").trim();
  if(!name){showErr("请输入起点城市");return;}
  showErr("");setBusy(true);
  setStatus('正在用 Nominatim 定位「'+esc(name)+'」…');
  try{
    const data=await getJSON("/api/geocode?city="+encodeURIComponent(name));
    state.origin=data.origin;
    state.cached={};
    (data.segments||[]).forEach(seg=>{state.cached[seg.band]=seg.place_count;});
    renderBandOptions();drawRings();fitRings();
    await loadPlaces(false);
  }catch(error){
    showErr("定位失败:"+error.message);setStatus("起点定位失败");
  }finally{setBusy(false);}
}

async function loadPlaces(refresh){
  if(!state.origin) return;
  showErr("");setBusy(true);
  const known=state.cached[state.band];
  if(refresh) setStatus("正在重新抓取 Overpass(公共源较慢,约 10-40s)…");
  else if(known===undefined) setStatus("该分段尚未入库,正在抓取 Overpass(约 10-40s)…");
  else setStatus("正在读取本地库(已入库,不触网)…");
  const params=new URLSearchParams({origin:state.origin.city,band:state.band,
    lat:String(state.origin.lat),lng:String(state.origin.lng)});
  if(state.category) params.set("category",state.category);
  if(refresh) params.set("refresh","true");
  try{
    const data=await getJSON("/api/places?"+params.toString());
    state.origin=data.origin;
    state.bandMeta=data.band;
    const total=Object.values(data.counts_by_category||{}).reduce((sum,value)=>sum+value,0);
    state.cached[state.band]=total;
    renderBandOptions();drawRings();fitRings();drawPins(data.places);renderLegend(data.counts_by_category);
    const from=(data.source==="db")?"本地 SQLite 读库(未触网)":"Overpass 实时抓取 → 已入库";
    const fetched=data.fetched_at?(" · 抓取于 "+esc(String(data.fetched_at).replace("T"," ").replace("+00:00","Z"))):"";
    setStatus('起点 <b>'+esc(data.origin.name)+"</b> · "+esc(data.band.label)+
      " · 分类 <b>"+esc(state.category||"全部")+"</b> · 显示 <b>"+data.count+"</b> / 库内 "+total+
      " 条 · 来源:"+from+fetched+" · 耗时 "+data.elapsed_s+"s");
    if(!data.count) showErr("该分段/分类下暂无已入库目的地,可换分段、换分类,或点「重新抓取」。");
  }catch(error){
    showErr("查询失败:"+error.message);setStatus("查询失败");
  }finally{setBusy(false);}
}

$("goCity").addEventListener("click",()=>searchCity($("city").value));
$("city").addEventListener("keydown",event=>{if(event.key==="Enter") searchCity($("city").value);});
$("band").addEventListener("change",event=>{state.band=event.target.value;drawRings();fitRings();loadPlaces(false);});
$("category").addEventListener("change",event=>{state.category=event.target.value;loadPlaces(false);});
$("reload").addEventListener("click",()=>loadPlaces(true));

(async function boot(){
  if(!window.L){
    showErr("Leaflet 未能从 CDN 加载(离线环境),地图不可用;后端 API 仍可直接访问 /api/places。");
    setStatus("Leaflet 加载失败");return;
  }
  initMap();
  try{await loadMeta();}catch(error){showErr("元信息加载失败:"+error.message);setStatus("元信息加载失败");return;}
  await searchCity(($("city").value||"").trim()||DEFAULT_CITY);
})();
</script>
</body>
</html>
